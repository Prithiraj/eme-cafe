name: Inspect Eme food photographs
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/inspect-food.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect public owner-posted references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research-media.py')
          source=p.read_text()
          start=source.index('SOURCES = {')
          end=source.index('\n}\n',start)+3
          replacements={
            'croffle':'https://www.facebook.com/61568487993875/videos/1003089842223680/',
            'morning':'https://www.facebook.com/61568487993875/photos/122152944134616266/',
            'creator':'https://www.facebook.com/smarteats.nikki/videos/976621957753315/',
            'food':'https://www.instagram.com/p/DF_HQd7z_sb/'
          }
          import json
          p.write_text(source[:start]+'SOURCES = '+json.dumps(replacements)+source[end:])
          PY
          python scripts/research-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: owner-food-references
          path: references
          retention-days: 3
