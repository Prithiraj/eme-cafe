name: Build, test and publish Eme’s Cafe
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static website
        run: python scripts/build.py
      - name: Install development-only browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false axe-core@4.10.3
      - name: Test responsive layouts, accessibility and essential actions
        run: python tests/browser_checks.py
      - name: Save browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Save static preview build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          retention-days: 7
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload tested Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published homepage and local assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, urllib.request, time
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base, timeout=20) as response:
                      html=response.read().decode()
                  assert 'Good mornings.' in html
                  assert '5759762822561383577' in html
                  assert 'noindex, nofollow' in html
                  for path in ['assets/styles.css','assets/app.js','credits.html','privacy.html','assets/media/brunch-480.webp']:
                      with urllib.request.urlopen(base+path,timeout=20) as response:
                          assert response.status == 200
                  print('Verified live homepage, business directions, preview status and assets:',base)
                  break
              except Exception:
                  if attempt == 11: raise
                  time.sleep(5)
          PY
