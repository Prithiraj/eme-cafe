name: Finalise responsive layout
on:
  push:
    paths: [.github/workflows/refine-layout.yml]
permissions:
  contents: write
  actions: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted source refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('src/styles.css')
          text=css.read_text()
          old='inset:0 -.5rem 3rem 1.5rem;transform:rotate(6deg)'
          assert old in text, 'Expected reviewed halo rule was not found'
          text=text.replace(old,'inset:0 1rem 3rem 1.5rem;transform:rotate(4deg)')
          text=text.replace('.hero-spark{position:absolute;bottom:-1.1rem;', '.hero-spark{position:absolute;pointer-events:none;bottom:-2.6rem;')
          text=text.replace('h1,h2{letter-spacing:-.055em;', 'h1,h2{word-spacing:.045em;letter-spacing:-.055em;')
          css.write_text(text)
          tests=Path('tests/browser_checks.py')
          text=tests.read_text().replace("page.evaluate('window.scrollTo(0,0)')", 'page.evaluate("document.documentElement.style.scrollBehavior=\'auto\'; window.scrollTo(0,0)")')
          tests.write_text(text)
          ignore=Path('.gitignore')
          text=ignore.read_text()
          for entry in ['node_modules/','test-results/','dist/']:
              if entry not in text.splitlines(): text+='\n'+entry+'\n'
          ignore.write_text(text)
          # Research results are retained in the provenance register, not repeatedly fetched.
          for path in ['.github/workflows/inspect-media.yml','.github/workflows/inspect-food.yml','scripts/research-media.py']:
              Path(path).unlink(missing_ok=True)
          importer=Path('.github/workflows/import-assets.yml')
          text=importer.read_text().replace('  push:\n    paths: [.github/workflows/import-assets.yml]\n','')
          importer.write_text(text)
          # This one-time source migration removes its own workflow after completion.
          Path('.github/workflows/refine-layout.yml').unlink()
          PY
      - name: Commit the reviewed refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles.css tests/browser_checks.py .gitignore .github/workflows scripts/research-media.py
          git commit -m 'Fix tablet halo overflow, improve headline spacing and finalise QA tooling'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Run the test-gated Pages deployment on the updated main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
