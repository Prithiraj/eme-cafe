name: Inspect public business media
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-media.yml
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public business image references
        run: python scripts/research-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: business-photo-references
          path: references
          retention-days: 3
